# Single-user local dev — run the adapter + NATS without nginx, for fast iteration.
# Point the frontend at ws://localhost:4223 directly (no /ws/ prefix proxy).

name: labweaver-dev

services:
  nats:
    image: nats:2.10-alpine
    container_name: labweaver-dev-nats
    restart: unless-stopped
    command: -c /etc/nats/nats.conf
    ports:
      - "4223:4222"
      - "8081:8080"   # frontend connects here directly: ws://localhost:8081
      - "8223:8222"
    volumes:
      - ./hub/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - labweaver-dev-net

  adapter:
    image: labweaver:dev
    container_name: labweaver-dev-user
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      NATS_SERVERS: "nats://nats:4222"
      NATS_USER: "agent"
      WORKSPACE_ROOT: "/workspace"
      DEFAULT_PROJECT: "/workspace"
      HOME: "/home/node"
      PG_URL: "postgres://labweaver:${POSTGRES_PASSWORD}@postgres:5432/labweaver"
      USERNAME: "devuser"
      MEMORY_API_URL: "http://indexer:8400"
      # Auto-shutdown kernels idle (no in-flight cell) longer than this.
      # Next execute re-spawns lazily. 0 disables culling.
      KERNEL_IDLE_CULL_MS: "14400000"
      KERNEL_CULL_CHECK_INTERVAL_MS: "60000"
    # .env carries SERVICE_ID (from hub/users.md) and provider API keys.
    env_file:
      - path: ./hub/workspaces/devuser/.env
        required: true
    volumes:
      - ./hub/workspaces/devuser/projects:/workspace/projects
      # Auto-mode projects and uploads; persisted across recreates like prod.
      - ./hub/workspaces/devuser/local_projects:/workspace/local_projects
      # Written by hub/scripts/setup-dev-user.sh (labweaver-memory MCP server).
      - ./hub/workspaces/devuser/.mcp.json:/workspace/.mcp.json:ro
      - ./hub/workspaces/devuser/.claude/chats:/workspace/.claude/chats
      - ./hub/workspaces/devuser/.claude/skills:/home/node/.claude/skills
      - ./hub/workspaces/devuser/.claude/settings.json:/home/node/.claude/settings.json
      # Harness commands, agents and hook scripts straight from the skeleton,
      # so dev runs the live copies. settings.json gets its hook entries from
      # hub/scripts/setup-dev-user.sh.
      - ./hub/skeleton/harness/commands:/home/node/.claude/commands:ro
      - ./hub/skeleton/harness/agents:/home/node/.claude/agents:ro
      - ./hub/skeleton/harness/hooks:/home/node/.claude/hooks:ro
      # DeepSeek Harness state: session logs (resume) + generated patch.
      - ./hub/workspaces/devuser/.dsh:/home/node/.dsh
    # The adapter's HTTP server (uploads, share snapshots). nginx proxies it
    # in prod; in dev the Vite server does (frontend/vite.config.ts).
    ports:
      - "127.0.0.1:5000:5000"
    working_dir: /workspace
    networks:
      - labweaver-dev-net

  postgres:
    image: pgvector/pgvector:0.8.2-pg16  # >=0.8 for hnsw.iterative_scan (memory search)
    container_name: labweaver-dev-postgres
    restart: unless-stopped
    env_file: [ ./hub/.env ]
    environment:
      POSTGRES_USER: labweaver
      POSTGRES_DB: labweaver
    volumes:
      - ./hub/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labweaver"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - labweaver-dev-net

  indexer:
    build: ./hub/indexer
    container_name: labweaver-dev-indexer
    restart: unless-stopped
    env_file: [ ./hub/.env ]
    environment:
      PG_URL: "postgres://labweaver:${POSTGRES_PASSWORD}@postgres:5432/labweaver"
      WORKSPACES_ROOT: /workspaces
      MAX_CONCURRENT_FILES: "4"
      LOG_LEVEL: debug
    volumes:
      - ./hub/workspaces:/workspaces:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - labweaver-dev-net

networks:
  labweaver-dev-net:
    driver: bridge
