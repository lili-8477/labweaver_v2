worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $lw_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Before any map: the upload map's keys are 64-char service IDs.
    map_hash_bucket_size 128;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # Docker embedded DNS — needed because /upload/ proxy_pass uses a
    # runtime variable ($lw_user). Without an explicit resolver,
    # nginx fails the lookup at request time with "host not found".
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The file routes (/upload/, /download/, /share-snapshot/, /api/glasses/)
    # find the user from the service ID the app already holds: the glasses
    # app sends it as `Authorization: Bearer`, the frontend stores it in the
    # lw_service cookie on connect (frontend/src/utils/hub-path.ts). There is
    # no login: the service ID already grants full control of that user's
    # agent, so it is the credential. scripts/service-id.sh writes the map
    # from hub/users.md. An unknown ID gets a plain 401.
    map $http_authorization $lw_key {
        "~^Bearer\s+(?<token>[0-9a-f]{64})$" $token;
        default $cookie_lw_service;
    }
    map $lw_key $lw_user {
        default "";
        include /etc/nginx/service-routes.map;
    }

    # $glasses_proxy_secret, rendered from hub/nginx-templates/ (see there).
    include /etc/nginx/conf.d/glasses-proxy-secret.conf;

    server {
        listen 80;
        server_name _;

        # NATS WebSocket endpoint for the frontend.
        location /ws/ {
            proxy_pass http://nats:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            limit_req zone=ws_limit burst=20 nodelay;
        }

        location /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Shared downloads (org-wide). URL: /download/shared/<path>
        # Served without a user prefix so every known user sees the same
        # shared workspace, matching the /workspace/shared/ view inside the
        # container. This location takes precedence over /download/ below
        # because nginx picks the most specific prefix match.
        location /download/shared/ {
            if ($lw_user = "") { return 401; }
            rewrite ^/download/(shared/.*)$ /$1 break;
            root /downloads;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Per-user uploads. URL: /upload/<path> →
        #   http://labweaver-<user>:5000/upload/<path>
        # The adapter HTTP server inside the user's container streams the
        # body to disk under /workspace/local_projects/. The user comes from
        # the service cookie (map above), so a request can only target the
        # container its service ID belongs to.
        location /upload/ {
            if ($lw_user = "") { return 401; }
            limit_req zone=upload_limit burst=20 nodelay;

            client_max_body_size 2g;
            proxy_request_buffering off;        # stream straight through
            proxy_send_timeout 30m;
            proxy_read_timeout 30m;

            proxy_pass http://labweaver-$lw_user:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $lw_user;
            proxy_set_header Cookie "";
        }

        # Glasses app uploads (docs/UPLOAD_API.md in lili-8477/labweaver-glasses).
        # The indexer stores them under hub/recordings/<user>/. The token is
        # stripped here, so the indexer only ever sees the resolved owner.
        location /api/glasses/ {
            if ($lw_user = "") { return 401; }
            limit_req zone=upload_limit burst=40 nodelay;

            client_max_body_size 64m;           # matches GLASSES_MAX_CHUNK_BYTES
            # Variable upstream: resolved per request, so nginx still starts
            # when the indexer is down.
            set $glasses_upstream indexer:8400;
            proxy_pass http://$glasses_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-User $lw_user;
            proxy_set_header X-Glasses-Proxy-Secret $glasses_proxy_secret;
            # complete joins an import's originals before it answers.
            proxy_read_timeout 300s;
        }

        # Glasses downloads. The indexer answers .../parts/{n} and
        # .../originals/{n} with X-Accel-Redirect to this path after checking
        # the owner; nginx then streams the file with Range (206), ETag and
        # sendfile. `internal`: clients cannot request it.
        location ^~ /_glasses_files/ {
            internal;
            alias /recordings/;
            include /etc/nginx/mime.types;
            types { image/heic heic; }
            add_header Cache-Control "private, no-cache";
        }

        # Per-user share-snapshot proxy. URL: /share-snapshot/<id>/file?path=<rel>
        # Routed to the user's adapter HTTP server (port 5000), which injects
        # actor=<user> and forwards to the indexer. Rate-limited shared
        # with /upload/ since both target the same per-user adapter.
        location /share-snapshot/ {
            if ($lw_user = "") { return 401; }
            limit_req zone=upload_limit burst=10 nodelay;

            proxy_pass http://labweaver-$lw_user:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $lw_user;
            proxy_set_header Cookie "";
            proxy_read_timeout 60s;
        }

        # Per-user downloads. URL: /download/<path>  →  /downloads/<user>/<path>
        # Example: /download/local_projects/pbmc3k_celltypist/data/pbmc3k.h5ad
        # Streams directly from disk — no NATS size limit.
        # .env and friends are mode 0600 so nginx (unprivileged) can't read them.
        location /download/ {
            if ($lw_user = "") { return 401; }
            rewrite ^/download/(.*)$ /$lw_user/$1 break;
            root /downloads;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Frontend static build. Run `cd frontend && npm ci && npm run build`
        # before `docker compose up -d`.
        location / {
            root /usr/share/nginx/html;
            include /etc/nginx/mime.types;
            types { application/javascript mjs; }
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ /index.html;

            location /assets/ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
